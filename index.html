<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買樂理財工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; color: #0f172a; background: #ffffff; }
  a { text-decoration: none; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid #eef1f5; position: sticky; top: 0; background: #fff; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .brand-name { font-size: 22px; font-weight: 700; color: #2563eb; white-space: nowrap; }
  nav { display: flex; gap: 32px; }
  nav a { font-size: 22px; color: #475569; font-weight: 600; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  nav a.active { color: #2563eb; border-bottom-color: #2563eb; }
  nav a:hover:not(.active) { color: #0f172a; }
  .contact-btn { border: 1.5px solid #2563eb; color: #2563eb; font-size: 22px; font-weight: 600; padding: 9px 20px; border-radius: 999px; white-space: nowrap; }
  .contact-btn:hover { background: #eef4ff; }
  @media (max-width: 860px) { nav { display: none; } }

  /* Page background decoration */
  .page-wrap { position: relative; overflow: hidden; background: linear-gradient(180deg, #eef6ff 0%, #f7fbff 45%, #ffffff 75%); }
  .page-wrap svg.deco-top { position: absolute; top: -20px; right: -60px; width: 720px; max-width: 65%; opacity: 0.5; pointer-events: none; }
  .page-wrap svg.deco-bottom { position: absolute; bottom: -10px; left: -60px; width: 640px; max-width: 60%; opacity: 0.4; pointer-events: none; transform: scaleX(-1); }

  .main { position: relative; max-width: 1240px; margin: 0 auto; padding: 56px 40px 20px; text-align: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f0ff; color: #2563eb; font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; margin-bottom: 22px; }
  .main h1 { font-size: 36px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
  .main p.desc { font-size: 15px; color: #64748b; margin-bottom: 44px; }

  /* Tool cards */
  .section-title { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 28px; }
  .section-title span { font-size: 22px; font-weight: 800; color: #0f172a; white-space: nowrap; }
  .section-title .line { flex: 1; max-width: 120px; height: 1px; background: linear-gradient(to right, transparent, #cbd5e1); }
  .section-title .line.right { background: linear-gradient(to left, transparent, #cbd5e1); }
  .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; text-align: left; margin-bottom: 56px; }
  .tool-card { display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 18px; padding: 22px 26px; box-shadow: 0 8px 24px -12px rgba(15,23,42,0.10); border: 1px solid #f1f5f9; }
  .tool-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .tool-icon.blue { background: #e8f0ff; color: #2563eb; }
  .tool-icon.teal { background: #e3faf5; color: #0d9488; }
  .tool-info { flex: 1; }
  .tool-info h3 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 3px; }
  .tool-info p { font-size: 13px; color: #94a3b8; }
  .tool-go { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .tool-go .circle { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .tool-go .circle.blue { background: #2563eb; }
  .tool-go .circle.teal { background: #0d9488; }
  .tool-go span { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .tool-go span.blue { color: #2563eb; }
  .tool-go span.teal { color: #0d9488; }

  /* Feature strip */
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; margin: 0 auto 60px; text-align: center; }
  .feature .f-icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px; }
  .feature:nth-child(1) .f-icon { background: #e8f0ff; color: #2563eb; }
  .feature:nth-child(2) .f-icon { background: #e3faf5; color: #0d9488; }
  .feature:nth-child(3) .f-icon { background: #fff4e5; color: #d97706; }
  .feature h4 { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .feature p { font-size: 13px; color: #94a3b8; }

  @media (max-width: 860px) {
    header { padding: 14px 20px; }
    .main { padding: 40px 20px 10px; }
    .main h1 { font-size: 26px; }
    .tools-grid { grid-template-columns: 1fr; }
    .features { grid-template-columns: 1fr; }
  }

  footer { text-align: center; padding: 26px 20px; color: #94a3b8; font-size: 13px; border-top: 1px solid #eef1f5; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="avatar" src="avatar.png" alt="頭像">
    <div class="brand-name">買樂理財工具</div>
  </div>
  <nav>
    <a href="index.html" class="active">首頁</a>
    <a href="calculator.html">配息計算</a>
    <a href="dca.html">定期定額</a>
  </nav>
  <a class="contact-btn" href="https://line.me/ti/p/0JGzWZG52U" target="_blank" rel="noopener">聯絡我</a>
</header>

<div class="page-wrap">
  <svg class="deco-top" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,220 90,190 170,230 250,150 330,180 410,100 490,140 570,60 650,90 700,40" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <g fill="#93c5fd">
      <circle cx="90" cy="190" r="4"/><circle cx="250" cy="150" r="4"/><circle cx="410" cy="100" r="4"/><circle cx="570" cy="60" r="4"/><circle cx="700" cy="40" r="5"/>
    </g>
  </svg>
  <svg class="deco-bottom" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,220 90,190 170,230 250,150 330,180 410,100 490,140 570,60 650,90 700,40" fill="none" stroke="#7dd3c8" stroke-width="2.5"/>
    <g fill="#7dd3c8">
      <circle cx="90" cy="190" r="4"/><circle cx="250" cy="150" r="4"/><circle cx="410" cy="100" r="4"/><circle cx="570" cy="60" r="4"/><circle cx="700" cy="40" r="5"/>
    </g>
  </svg>

  <div class="main">
    <h1>選擇工具，開始你的理財試算</h1>
    <p class="desc">用簡單的數字，看見每月現金流與長期累積成果。</p>

    <div class="section-title">
      <div class="line"></div>
      <span>選擇你要使用的工具</span>
      <div class="line right"></div>
    </div>

    <div class="tools-grid">
      <a class="tool-card" href="calculator.html">
        <div class="tool-icon blue">🧮</div>
        <div class="tool-info">
          <h3>配息計算機</h3>
          <p>快速估算每月現金流</p>
        </div>
        <div class="tool-go">
          <div class="circle blue">›</div>
          <span class="blue">立即試算</span>
        </div>
      </a>

      <a class="tool-card" href="dca.html">
        <div class="tool-icon teal">📈</div>
        <div class="tool-info">
          <h3>定期定額</h3>
          <p>看見時間與複利的力量</p>
        </div>
        <div class="tool-go">
          <div class="circle teal">›</div>
          <span class="teal">開始計算</span>
        </div>
      </a>
    </div>

    <div class="features">
      <div class="feature">
        <div class="f-icon">👆</div>
        <h4>操作簡單</h4>
        <p>介面直觀，快速上手</p>
      </div>
      <div class="feature">
        <div class="f-icon">⏱️</div>
        <h4>即時計算</h4>
        <p>輸入數字，立即看結果</p>
      </div>
      <div class="feature">
        <div class="f-icon">🎁</div>
        <h4>免費使用</h4>
        <p>所有工具完全免費</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
