<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買樂保險理財</title>
<link rel="stylesheet" href="auth.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; color: #0f172a; background: #ffffff; }
  a { text-decoration: none; }

  header { display: flex; align-items: center; justify-content: center; padding: 20px 40px; border-bottom: 1px solid #eef1f5; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .brand-name { font-size: 22px; font-weight: 700; color: #2563eb; white-space: nowrap; }

  .page-wrap { position: relative; overflow: hidden; background: linear-gradient(180deg, #eef6ff 0%, #f7fbff 45%, #ffffff 75%); min-height: calc(100vh - 81px); }
  .page-wrap svg.deco-top { position: absolute; top: -20px; right: -60px; width: 720px; max-width: 65%; opacity: 0.5; pointer-events: none; }
  .page-wrap svg.deco-bottom { position: absolute; bottom: -10px; left: -60px; width: 640px; max-width: 60%; opacity: 0.4; pointer-events: none; transform: scaleX(-1); }

  .main { position: relative; max-width: 900px; margin: 0 auto; padding: 72px 40px 40px; text-align: center; }
  .main h1 { font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
  .main p.desc { font-size: 15px; color: #64748b; margin-bottom: 48px; }

  .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; text-align: left; }
  .hub-card {
    background: #fff; border-radius: 22px; padding: 36px 30px; box-shadow: 0 20px 45px -20px rgba(15,23,42,0.15);
    border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: flex-start;
    transition: transform .15s, box-shadow .15s;
  }
  .hub-card:hover { transform: translateY(-2px); box-shadow: 0 24px 50px -18px rgba(15,23,42,0.2); }
  .hub-icon { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; margin-bottom: 20px; align-self: center; }
  .hub-icon.blue { background: #e8f0ff; color: #2563eb; }
  .hub-icon.violet { background: #f3e8ff; color: #7c3aed; }
  .hub-card h3 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
  .hub-card p { font-size: 13.5px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
  .hub-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px;
    border-radius: 12px; font-size: 15px; font-weight: 700; color: #fff; margin-top: auto;
  }
  .hub-btn.blue { background: #2563eb; }
  .hub-btn.blue:hover { background: #1d4ed8; }
  .hub-btn.violet { background: #7c3aed; }
  .hub-btn.violet:hover { background: #6d28d9; }

  @media (max-width: 640px) {
    header { padding: 16px 20px; }
    .main { padding: 48px 20px 20px; }
    .main h1 { font-size: 24px; }
    .hub-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<script src="auth.js"></script>
<div id="main-content" style="display:none;">

<header>
  <div class="brand">
    <img class="avatar" src="avatar.png" alt="頭像">
    <div class="brand-name">買樂保險理財</div>
  </div>
</header>

<div class="page-wrap">
  <svg class="deco-top" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,220 90,190 170,230 250,150 330,180 410,100 490,140 570,60 650,90 700,40" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <g fill="#93c5fd">
      <circle cx="90" cy="190" r="4"/><circle cx="250" cy="150" r="4"/><circle cx="410" cy="100" r="4"/><circle cx="570" cy="60" r="4"/><circle cx="700" cy="40" r="5"/>
    </g>
  </svg>
  <svg class="deco-bottom" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,220 90,190 170,230 250,150 330,180 410,100 490,140 570,60 650,90 700,40" fill="none" stroke="#7dd3c8" stroke-width="2.5"/>
    <g fill="#7dd3c8">
      <circle cx="90" cy="190" r="4"/><circle cx="250" cy="150" r="4"/><circle cx="410" cy="100" r="4"/><circle cx="570" cy="60" r="4"/><circle cx="700" cy="40" r="5"/>
    </g>
  </svg>

  <div class="main">
    <h1>選擇要開啟的系統</h1>
    <p class="desc">理財試算工具與建議書系統。</p>

    <div class="hub-grid">
      <a class="hub-card" href="tools.html">
        <div class="hub-icon blue">🧮</div>
        <h3>理財工具</h3>
        <p>配息計算機、定期定額、房產活化等理財試算工具。</p>
        <div class="hub-btn blue">開啟理財工具 ›</div>
      </a>

      <a class="hub-card" href="proposal.html">
        <div class="hub-icon violet">📋</div>
        <h3>建議書系統</h3>
        <p>各商品分類試算，產出符合官方範本的建議書。</p>
        <div class="hub-btn violet">開啟建議書系統 ›</div>
      </a>
    </div>
  </div>
</div>

</div>
</body>
</html>
