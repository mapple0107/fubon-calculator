<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房產活化試算機</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 40%, #f5f5f7 100%);
    color: #1d1d1f; min-height: 100vh; padding: 2.5rem 1rem;
    font-size: 18px;
  }
  .container { width: 70%; max-width: 1100px; margin: 0 auto; zoom: 1.4; }
  @media (max-width: 768px) {
    .container { width: 100%; max-width: 100%; zoom: 1; }
    body { padding: 1.25rem 0.75rem; font-size: 16px; }
  }
  .back-link { display:inline-flex; align-items:center; gap:4px; margin-bottom:16px; font-size:14px; color:#0071e3; text-decoration:none; font-weight:600; }
  h1 { font-size: 2rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .subtitle { font-size: 14px; color: #86868b; margin-bottom: 2.5rem; }
  .nav-cards { display:flex; gap:12px; margin-bottom:1.5rem; }
  .nav-card {
    flex:1; background:#fff; border-radius:18px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; text-decoration:none; color:#1d1d1f;
    box-shadow:0 4px 14px rgba(0,0,0,0.04); border:1.5px solid transparent; transition:all .15s;
  }
  .nav-card:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,0.08); }
  .nav-card.active { border-color:#0071e3; background:linear-gradient(135deg,#eef6ff,#f5faff); }
  .nav-icon {
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:20px; background:#eef6ff; flex-shrink:0;
  }
  .nav-card.active .nav-icon { background:#0071e3; }
  .nav-title { font-size:14px; font-weight:700; }
  .nav-sub { font-size:11px; color:#86868b; }
  .card {
    background: #fff; border-radius: 22px; padding: 1.75rem; margin-bottom: 1.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03);
  }
  .card h2 {
    font-size: 12px; font-weight: 700; color: #86868b; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid #f0f0f2;
  }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid3 .input-wrap input { min-width: 0; width: 100%; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: #86868b; font-weight: 500; }
  .input-wrap { display: flex; align-items: center; gap: 6px; }
  .input-wrap input {
    font-size: 16px; font-weight: 600; padding: 11px 13px; border-radius: 12px;
    border: 1px solid #e5e5ea; background: #f9f9fb; color: #1d1d1f; flex: 1;
    font-family: "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .input-wrap input:focus { outline: none; border-color: #0071e3; background: #fff; box-shadow: 0 0 0 4px rgba(0,113,227,0.08); }
  .input-wrap .unit { font-size: 13px; color: #86868b; white-space: nowrap; }
  .fee-info {
    font-size: 12px; color: #0071e3; background: #eef6ff;
    border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-weight: 500;
    font-family: "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .calc-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #0071e3, #0090ff);
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px;
    box-shadow: 0 6px 16px rgba(0,113,227,0.25); transition: all 0.15s;
  }
  .calc-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,113,227,0.32); }
  .warn { display:none; background:#fff3f0; color:#d0392b; border-radius:10px; padding:10px 14px; font-size:13px; margin-top:10px; font-weight:600; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  .metric {
    background: linear-gradient(135deg, #eef6ff, #f5faff); border-radius: 16px;
    padding: 16px 14px; border: 1px solid #e0eeff; text-align: center;
  }
  .metric .m-label { font-size: 12px; color: #0071e3; margin-bottom: 6px; font-weight: 600; }
  .metric .m-val {
    font-size: 22px; font-weight: 800; color: #0071e3; letter-spacing: -0.02em;
    font-family: "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; font-size: 12px; color: #86868b; font-weight: 700; border-bottom: 2px solid #f0f0f2; }
  td {
    padding: 12px 10px; border-bottom: 1px solid #f5f5f7;
    font-family: "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  tr:last-child td { border-bottom: none; }
  .results { display: none; }
  .results.show { display: block; }
  .summary-row { font-size: 12.5px; color: #86868b; margin-top: 10px; text-align: center; }
  @media (max-width: 500px) { .grid3, .metric-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">← 返回首頁</a>
  <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom: 2.5rem; text-align:left;">
    <img src="avatar.png" alt="頭像" style="width:100px; height:100px; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.15); flex-shrink:0;">
    <div>
      <h1 style="margin-bottom:2px; font-size:2.6rem;">房產活化試算機</h1>
      <p class="subtitle" style="margin-bottom:0;">理財型房貸增貸投資試算</p>
    </div>
  </div>

  <div class="nav-cards">
    <a href="calculator.html" class="nav-card">
      <div class="nav-icon">💰</div>
      <div><div class="nav-title">配息計算機</div><div class="nav-sub">VCCT 月配息試算</div></div>
    </a>
    <a href="dca.html" class="nav-card">
      <div class="nav-icon">📈</div>
      <div><div class="nav-title">定期定額</div><div class="nav-sub">複利累積試算</div></div>
    </a>
    <a href="leverage.html" class="nav-card active">
      <div class="nav-icon">🏠</div>
      <div><div class="nav-title">房產活化</div><div class="nav-sub">增貸投資試算</div></div>
    </a>
  </div>

  <div class="card">
    <h2>房屋與增貸額度</h2>
    <div class="grid3">
      <div class="field">
        <label>房屋現值（鑑價／市價）</label>
        <div class="input-wrap">
          <input type="number" id="propValue" value="1000" step="10" oninput="updateAvailable()">
          <span class="unit">萬元</span>
        </div>
      </div>
      <div class="field">
        <label>目前房貸餘額</label>
        <div class="input-wrap">
          <input type="number" id="curLoan" value="300" step="10" oninput="updateAvailable()">
          <span class="unit">萬元</span>
        </div>
      </div>
      <div class="field">
        <label>可增貸成數</label>
        <div class="input-wrap">
          <input type="number" id="ltvPct" value="80" step="1" oninput="updateAvailable()">
          <span class="unit">%</span>
        </div>
      </div>
    </div>
    <div class="fee-info" id="avail-info" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <h2>增貸投資設定</h2>
    <div class="grid3">
      <div class="field">
        <label>增貸投入金額</label>
        <div class="input-wrap">
          <input type="number" id="drawAmount" value="0" step="10" oninput="onDrawManualChange()">
          <span class="unit">萬元</span>
        </div>
      </div>
      <div class="field">
        <label>增貸利率</label>
        <div class="input-wrap">
          <input type="number" id="loanRate" value="2.3" step="0.05">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="field">
        <label>預期投資年化報酬率</label>
        <div class="input-wrap">
          <input type="number" id="investRate" value="6" step="0.1">
          <span class="unit">%</span>
        </div>
      </div>
    </div>
    <div class="warn" id="leverage-warn"></div>
  </div>

  <button class="calc-btn" onclick="calcLeverage()">計算房產活化試算</button>

  <div class="results card" id="leverage-results" style="margin-top:1.25rem;">
    <h2>試算結果</h2>
    <div style="font-size:11px; color:#86868b; margin:-8px 0 12px;">
      本試算以固定增貸利率與固定預期投資報酬率估算每月／每年現金流差額，未考慮房貸本金攤還、投資市值波動或複利效果，屬理想化情境僅供參考；實際可增貸金額與核貸利率依銀行審核條件為準，投資報酬並非保證，請審慎評估財務槓桿風險。
    </div>
    <div class="metric-grid" id="leverage-metrics"></div>
    <table>
      <thead><tr><th>年度</th><th>當年淨現金流</th><th>累積淨現金流</th></tr></thead>
      <tbody id="leverage-table"></tbody>
    </table>
    <div class="summary-row" id="leverage-summary"></div>
  </div>
</div>

<script>
function fmt(n, dec=0) { return Math.round(n).toLocaleString('zh-TW',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function showWarn(el, msg) { el.style.display='block'; el.textContent=msg; }

let drawTouched = false;
function onDrawManualChange() { drawTouched = true; }

function updateAvailable() {
  const propVal = (parseFloat(document.getElementById('propValue').value) || 0) * 10000;
  const curLoan = (parseFloat(document.getElementById('curLoan').value) || 0) * 10000;
  const ltv = (parseFloat(document.getElementById('ltvPct').value) || 0) / 100;
  const avail = Math.max(propVal * ltv - curLoan, 0);
  document.getElementById('avail-info').textContent = `可增貸額度：約 TWD ${fmt(avail)}（約 ${fmt(avail/10000)} 萬元）`;
  if (!drawTouched) {
    document.getElementById('drawAmount').value = (avail/10000).toFixed(0);
  }
  return avail;
}

function calcLeverage() {
  const avail = updateAvailable();
  const drawWan = parseFloat(document.getElementById('drawAmount').value) || 0;
  const draw = drawWan * 10000;
  const loanRate = (parseFloat(document.getElementById('loanRate').value) || 0) / 100;
  const investRate = (parseFloat(document.getElementById('investRate').value) || 0) / 100;
  const warn = document.getElementById('leverage-warn');

  if (draw <= 0) { showWarn(warn, '請輸入增貸投入金額。'); return; }
  if (draw > avail) {
    showWarn(warn, `增貸投入金額 ${fmt(drawWan)} 萬元，超過估算可增貸額度（約 ${fmt(avail/10000)} 萬元），實際金額仍以銀行核貸為準。`);
  } else {
    warn.style.display = 'none';
  }

  const monthlyInterest = draw * loanRate / 12;
  const monthlyInvestIncome = draw * investRate / 12;
  const monthlyNet = monthlyInvestIncome - monthlyInterest;
  const yearlyNet = monthlyNet * 12;
  const spreadPct = (investRate - loanRate) * 100;
  const netColor = monthlyNet >= 0 ? '#0071e3' : '#d0392b';

  document.getElementById('leverage-metrics').innerHTML = `
    <div class="metric"><div class="m-label">🏦 每月貸款利息</div><div class="m-val">TWD ${fmt(monthlyInterest)}</div></div>
    <div class="metric"><div class="m-label">📈 每月預估投資收益</div><div class="m-val">TWD ${fmt(monthlyInvestIncome)}</div></div>
    <div class="metric"><div class="m-label">💰 每月淨現金流</div><div class="m-val" style="color:${netColor};">TWD ${fmt(monthlyNet)}</div></div>
  `;

  const tbody = document.getElementById('leverage-table');
  tbody.innerHTML = '';
  [1,3,5,10,20].forEach(y => {
    const cum = yearlyNet * y;
    const color = cum >= 0 ? '#1a8a3c' : '#d0392b';
    tbody.innerHTML += `<tr><td>第 ${y} 年</td><td style="color:${netColor}">TWD ${fmt(yearlyNet)}</td><td style="color:${color}">TWD ${fmt(cum)}</td></tr>`;
  });

  document.getElementById('leverage-summary').textContent =
    `增貸投入 TWD ${fmt(draw)}（房貸利率 ${(loanRate*100).toFixed(2)}% vs 投資報酬率 ${(investRate*100).toFixed(2)}%，年化利差 ${spreadPct.toFixed(2)}%）｜每年淨現金流 TWD ${fmt(yearlyNet)}`;

  document.getElementById('leverage-results').classList.add('show');
  document.getElementById('leverage-results').scrollIntoView({behavior:'smooth'});
}

updateAvailable();
</script>
</body>
</html>
